name: Dossier
options:
  bundleIdPrefix: party.sahmai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: true
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  Dossier:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/App
      - path: Resources/Assets.xcassets
    dependencies:
      - target: DossierShareExtension
        embed: true
      - sdk: EventKit.framework
      - sdk: EventKitUI.framework
      - sdk: MessageUI.framework
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: party.sahmai.dossier.ios
        PRODUCT_NAME: Dossier
        INFOPLIST_FILE: Config/Dossier-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Dossier.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
      gatherCoverageData: false
  DossierShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/ShareExtension
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: party.sahmai.dossier.ios.ShareExtension
        PRODUCT_NAME: DossierShareExtension
        INFOPLIST_FILE: Config/ShareExtension-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/DossierShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
