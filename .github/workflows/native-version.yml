name: Native version and changelog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Identify native release changes
        id: native
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            exit 0
          fi
          base="$BASE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          fi
          if ! git diff --quiet "$base" "$HEAD_SHA" -- ios ':(exclude)ios/README.md' ':(exclude)ios/CHANGELOG.md' scripts/build-native-ios.sh src/app/api/mobile src/lib/mobile; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            if git diff --quiet "$base" "$HEAD_SHA" -- ios/CHANGELOG.md; then
              echo "::error file=ios/CHANGELOG.md::Add personal release notes for the native or mobile API change."
              exit 1
            fi
            git show "$HEAD_SHA:ios/CHANGELOG.md" | grep -Fx '## Personal release notes' >/dev/null
          fi
      - name: Record source and native build versions
        env:
          NATIVE_CHANGED: ${{ steps.native.outputs.changed }}
        run: |
          {
            if [[ "$GITHUB_EVENT_NAME" == push && "$NATIVE_CHANGED" == true ]]; then
              echo '### Personal iOS source release'
            else
              echo '### Dossier build identity'
            fi
            echo
            echo '```'
            scripts/build-native-ios.sh --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
